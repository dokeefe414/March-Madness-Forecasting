name: CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
jobs:
  research:
    name: Python research unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test forecasting models and CSV handling
        env:
          PYTHONPATH: research
        run: python -m unittest discover -s research/tests -v
  website:
    name: Typecheck and build website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run check:data
      - run: npm run typecheck
      - run: npm run build
