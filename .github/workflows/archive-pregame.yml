name: Archive real pre-tipoff forecasts
on:
  schedule:
    # 13:07 UTC during regular-season months; GitHub schedules are best-effort.
    - cron: "7 13 * 1,2,3,4,11,12 *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: march-forecast-pregame-ledger
  cancel-in-progress: false
jobs:
  archive:
    name: Capture scheduled pre-tipoff probabilities and settle prior forecasts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build source-verified, timestamped current ratings
        env:
          PYTHONPATH: research
        run: python -m forecast.live --out web/public/current/2027.json
      - name: Snapshot future ESPN fixtures only and settle past NCAA finals
        env:
          PYTHONPATH: research
        run: python -m forecast.snapshot --ratings web/public/current/2027.json --out-dir web/public/forecasts
      - name: Commit immutable, public ledger entries
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/forecasts
          if git diff --cached --quiet; then
            echo "No new verified predictions or settlements to archive."
          else
            git commit -m "Archive pre-tipoff source-verified forecasts and result settlements [skip ci]"
            git push origin HEAD:main
          fi
