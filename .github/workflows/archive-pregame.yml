name: Archive real pre-tipoff forecasts
on:
  schedule:
    # 9:07 a.m. local Eastern daily in basketball season.
    # Lets the 1 a.m. + 5:17 a.m. source refreshes finish before forward picks.
    # Never retroactively labels a completed game a pregame forecast.
    - cron: "7 9 * 1,2,3,4,11,12 *"
      timezone: "America/New_York"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: march-forecast-pregame-ledger
  cancel-in-progress: false
jobs:
  archive:
    name: Capture scheduled pre-tipoff probabilities and settle prior forecasts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build source-verified, timestamped current ratings
        env:
          PYTHONPATH: research
        run: python -m forecast.live --out web/public/current/2027.json --games-out web/public/current/2027-games.json
      - name: Chronologically retrain current-season model before fixture snapshot
        env:
          PYTHONPATH: research
        run: python -m forecast.retrain --games web/public/current/2027-games.json --ratings web/public/current/2027.json --out web/public/current/2027-online-model.json
      - name: Recompute source-linked causal state-space challenger for audit
        env:
          PYTHONPATH: research
        run: python -m forecast.state_space --games web/public/current/2027-games.json --ratings web/public/current/2027.json --out web/public/current/2027-state-space.json
      - name: Snapshot future ESPN fixtures only and settle past NCAA finals
        env:
          PYTHONPATH: research
        run: python -m forecast.snapshot --ratings web/public/current/2027.json --online-model web/public/current/2027-online-model.json --state-space web/public/current/2027-state-space.json --out-dir web/public/forecasts
      - name: Audit source timestamps, forecast buffer and score arithmetic
        env:
          PYTHONPATH: research
        run: python -m forecast.audit --dir web/public/forecasts
      - name: Commit immutable, public ledger entries
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/forecasts
          if git diff --cached --quiet; then
            echo "No new verified predictions or settlements to archive."
          else
            git commit -m "Archive pre-tipoff source-verified forecasts and result settlements [skip ci]"
            git push origin HEAD:main
          fi
