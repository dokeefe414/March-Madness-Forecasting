name: Monitor before-tipoff prediction archive freshness
on:
  workflow_dispatch:
  schedule:
    # After overnight 02:07/06:07 and daytime 09:07/16:07 archives.
    # 07:35 catches missed overnight settlement before the morning visit.
    # 11:35 and 18:35 protect morning and afternoon captures.
    - cron: "35 7,11,18 * 1,2,3,4,11,12 *"
      timezone: "America/New_York"
permissions:
  contents: read
  issues: write
jobs:
  verify:
    name: Ensure prior real-game forecast evidence was archived
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check missing or stale archive (never invent win percentage)
        env:
          PYTHONPATH: research
        run: python -m forecast.archive_health --ledger web/public/forecasts --require-recent --max-age-hours 26
      - name: Verify original predictions and recorded score arithmetic
        env:
          PYTHONPATH: research
        run: python -m forecast.audit --dir web/public/forecasts
      - name: Open one actionable issue on archive monitor failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          title="Forecast archive health needs attention"
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "Open archive recovery issue #$existing already exists; no duplicate created."
          else
            gh issue create --title "$title" --body "The scheduled pretipoff archive monitor failed. See the [failed workflow run]($RUN_URL). Check missing/stale original snapshots, source availability, and Git write permissions. Recover using docs/v09-forecast-operations.md. Never backfill forecasts after tipoff."
          fi
