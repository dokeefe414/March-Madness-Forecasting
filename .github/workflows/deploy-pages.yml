name: Deploy website to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Best-effort daily refresh during the NCAA basketball season.
    - cron: "22 14 * 1,2,3,4,11,12 *"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/configure-pages@v5
      - name: Build historical-only research and model-calibration artifact
        env:
          PYTHONPATH: research
        run: python -m forecast.benchmark --web-dir web --out web/public/research/benchmark.json
      - name: Validate and build 2027 NCAA-source results
        env:
          PYTHONPATH: research
        run: python -m forecast.live --model-report web/public/research/benchmark.json --out web/public/current/2027.json
      - name: Install frontend dependencies
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Validate snapshot
        working-directory: web
        run: npm run check:data
      - name: Generate static website
        working-directory: web
        env:
          NEXT_PUBLIC_BASE_PATH: /March-Madness-Forecasting
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out
      - id: deployment
        uses: actions/deploy-pages@v4
