name: Deploy website to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Nightly Eastern local time (EST/EDT, including daylight saving changes).
    # Best-effort GitHub Actions trigger: actual execution can lag.
    - cron: "0 1 * * *"
      timezone: "America/New_York"
    # Late-result catch-up after West Coast games, during basketball months.
    - cron: "17 5 * 1,2,3,4,11,12 *"
      timezone: "America/New_York"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/configure-pages@v5
      - name: Build historical-only research and model-calibration artifact
        env:
          PYTHONPATH: research
        run: python -m forecast.benchmark --web-dir web --out web/public/research/benchmark.json
      - name: Validate and build 2027 NCAA-source results
        env:
          PYTHONPATH: research
        run: python -m forecast.live --model-report web/public/research/benchmark.json --out web/public/current/2027.json --games-out web/public/current/2027-games.json
      - name: Retrain 2027 logistic model on earlier game dates and walk-forward score
        env:
          PYTHONPATH: research
        run: python -m forecast.retrain --games web/public/current/2027-games.json --ratings web/public/current/2027.json --out web/public/current/2027-online-model.json
      - name: Validate accepted-game totals and publish refresh provenance
        env:
          PYTHONPATH: research
        run: python -m forecast.freshness --input web/public/current/2027.json --out web/public/current/refresh-status.json
      - name: Verify immutable forecast audit before site publication
        env:
          PYTHONPATH: research
        run: python -m forecast.audit --dir web/public/forecasts
      - name: Install frontend dependencies
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Validate snapshot
        working-directory: web
        run: npm run check:data
      - name: Generate static website
        working-directory: web
        env:
          NEXT_PUBLIC_BASE_PATH: /March-Madness-Forecasting
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out
      - id: deployment
        uses: actions/deploy-pages@v4
